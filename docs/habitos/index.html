<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#146B4E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hábitos" />
    <title>Mis Hábitos</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon.svg" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="eyebrow">bitácora personal</div>
        <h1 id="viewTitle">Hoy</h1>
      </header>

      <main id="view" class="view"></main>

      <nav class="tabbar" id="tabbar">
        <button class="tab" data-tab="hoy"><span class="tabIcon">🏠</span><span>Hoy</span></button>
        <button class="tab" data-tab="semana">
          <span class="tabIcon">📅</span><span>Semana</span>
        </button>
        <button class="tab" data-tab="insights">
          <span class="tabIcon">💡</span><span>Insights</span>
        </button>
        <button class="tab" data-tab="ajustes">
          <span class="tabIcon">⚙️</span><span>Ajustes</span>
        </button>
      </nav>
    </div>

    <script src="js/app.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/bitacora-entrenamiento/habitos/sw.js');
        });
      }
    </script>
  </body>
</html>
